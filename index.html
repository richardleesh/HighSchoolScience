<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chris' High School Science</title><style>
:root{--navy:#173b5d;--blue:#1769aa;--ink:#203040;--muted:#69798a;--line:#d8e0e8}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#f3f6f9}.top{height:64px;background:var(--navy);color:white;display:flex;align-items:center;padding:0 22px;font-size:1.15rem;font-weight:700}.layout{height:calc(100vh - 64px);min-height:480px;display:grid;grid-template-columns:280px minmax(0,1fr)}aside{background:#fff;border-right:1px solid var(--line);padding:20px 14px;overflow:auto}aside h2{font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 8px 12px}.course{font-size:.88rem;font-weight:700;color:#415367;margin:18px 8px 7px}.item{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:11px 12px;border-radius:8px;font:inherit;cursor:pointer}.item:hover{background:#eef4f8}.item.active{background:#e7f2fb;color:#075b96;font-weight:700;border-left:3px solid var(--blue)}.main{min-width:0;display:flex;flex-direction:column}.welcome{padding:18px 24px;border-bottom:1px solid var(--line);background:white}.welcome h1{margin:0;font-size:1.25rem}.welcome p{margin:3px 0 0;color:var(--muted)}iframe{border:0;width:100%;height:100%;background:white}@media(max-width:700px){.layout{grid-template-columns:190px minmax(0,1fr)}aside{padding:14px 8px}.welcome{padding:14px}.item{padding:10px 8px;font-size:.9rem}}@media(max-width:520px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:calc(100vh - 64px)}aside{border-right:0;border-bottom:1px solid var(--line)}.main{height:80vh}}
</style></head><body><div class="top">Chris' High School Science</div><div class="layout"><aside><h2>Handouts &amp; Tests</h2><div class="course">GRADE 10 · SCIENCE</div><button class="item active" data-src="The Cell Cycle and Cell Division.html">The Cell Cycle and Cell Division</button></aside><div class="main"><div class="welcome"><h1 id="selectedTitle">The Cell Cycle and Cell Division</h1><p>Select a handout or test from the left panel.</p></div><iframe id="viewer" title="Selected handout"></iframe></div></div><script>
const viewer=document.getElementById('viewer'),title=document.getElementById('selectedTitle');document.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));b.classList.add('active');title.textContent=b.textContent.trim();viewer.src=b.dataset.src}));viewer.src=document.querySelector('.item.active').dataset.src;
</script></body></html>
